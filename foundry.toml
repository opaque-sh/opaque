[profile.default]
src = "contracts/src"
test = "contracts/test"
script = "contracts/script"
out = "out"
libs = ["lib"]
remappings = ["v4-core/=lib/v4-core/src/"]
fs_permissions = [{ access = "read", path = "./lib/v4-core/out" }, { access = "read", path = "./contracts/test/fixtures" }]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false

# The generated UltraHonk verifier is just over the 24,576 byte contract limit at 200 runs. Compile only that file with
# a low runs setting so it fits (24,489 bytes at 1 to 20 runs). Everything else keeps 200.
additional_compiler_profiles = [{ name = "verifier", optimizer_runs = 1 }]
compilation_restrictions = [{ paths = "contracts/src/HonkVerifier.sol", optimizer_runs = 1 }]
# legacy/ is outside src, test and script, so it is never compiled.


[fuzz]
runs = 256

[invariant]
runs = 256
depth = 400
